name: Design version history

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  preserve-design-history:
    name: 保留设计历史
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the proposed version
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test the version preservation checker
        run: python -m unittest discover -s tests -p test_design_versions.py
      - name: Compare with the current target branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/policy-base"
          python scripts/check-design-versions.py --base refs/remotes/origin/policy-base --head HEAD
